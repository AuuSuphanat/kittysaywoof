<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart - Kitty, say woof</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">KSW</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" th:href="@{/}">Home</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/products}">Product</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/cart}">Cart</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/about}">About</a></li>
            <li class="nav-item"><a class="nav-link active" th:href="@{/contact}">Contact</a></li>
          </ul>
          <form class="d-flex" role="search" onsubmit="return searchProduct()">
            <input class="form-control me-2" type="search" placeholder="Search" id="searchInput" />
            <button class="btn btn-warning" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Success message -->
    <div th:if="${param.success}" class="alert alert-success text-center mt-3" role="alert">
      ✅ Your order has been submitted successfully!
    </div>

    <!-- Cart Content -->
    <div class="container py-5">
      <h1 class="text-center mb-4">🛒 Your Cart</h1>

      <table class="table table-bordered cart-table">
        <thead class="table-warning">
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
            <th>Remove</th>
          </tr>
        </thead>
        <tbody id="cart-body"></tbody>
      </table>

      <div class="cart-total" id="cart-total">Total: $0.00</div>

      <!-- Checkout form -->
      <form th:action="@{/checkoutform}" method="post" onsubmit="return prepareCheckout()">
        <input type="hidden" name="cartData" id="cartDataInput" />
        <input type="hidden" name="total" id="totalInput" />
        <div class="text-center mt-4">
          <a th:href="@{/products}" class="btn btn-outline-primary">Continue Shopping</a>
          <button type="submit" class="btn btn-success">Checkout</button>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
      <p>
        &copy; 2025 Kitty, say woof | Follow us on
        <a href="#" class="text-warning">Facebook</a>,
        <a href="#" class="text-warning">Instagram</a>
      </p>
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const cartBody = document.getElementById("cart-body");
      const cartTotal = document.getElementById("cart-total");

      function loadCart() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        cartBody.innerHTML = "";
        let total = 0;

        cart.forEach((item, index) => {
          const itemTotal = item.price * item.quantity;
          total += itemTotal;

          cartBody.innerHTML += `
            <tr>
              <td>${item.name}</td>
              <td>$${item.price.toFixed(2)}</td>
              <td>
                <input type="number" min="1" value="${item.quantity}" class="form-control form-control-sm"
                       onchange="updateQuantity(${index}, this.value)">
              </td>
              <td>$${itemTotal.toFixed(2)}</td>
              <td>
                <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Remove</button>
              </td>
            </tr>
          `;
        });

        cartTotal.textContent = `Total: $${total.toFixed(2)}`;
      }

      function updateQuantity(index, newQty) {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart[index].quantity = parseInt(newQty);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
      }

      function removeItem(index) {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();
      }

      function prepareCheckout() {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];

        if (cart.length === 0) {
          alert("🛑 Your cart is empty.");
          return false;
        }

        let total = 0;
        const formatted = cart.map(item => {
          const itemTotal = item.price * item.quantity;
          total += itemTotal;
          return `Product: ${item.name}, Price: $${item.price}, Quantity: ${item.quantity}, Subtotal: $${itemTotal.toFixed(2)}`;
        }).join('\n');

        document.getElementById("cartDataInput").value = formatted;
        document.getElementById("totalInput").value = "$" + total.toFixed(2);

        localStorage.removeItem("cart");
        return true;
      }

      
      function searchProduct() {
        const query = document.getElementById("searchInput").value;
        if (query.trim() !== "") {
          window.location.href = "/products?search=" + encodeURIComponent(query);
        }
        return false;
      }
    

      loadCart();
    </script>
  </body>
</html>
